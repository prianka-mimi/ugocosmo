[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/castilo-admin/htdocs/admin.castilo.co.uk/artisan queue:work --queue=shopify-imports,high,default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=castilo-admin
numprocs=3
redirect_stderr=true
stdout_logfile=/home/castilo-admin/htdocs/admin.castilo.co.uk/storage/logs/worker.log
stopwaitsecs=60

[program:laravel-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /home/castilo-admin/htdocs/admin.castilo.co.uk/artisan reverb:start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=castilo-admin
numprocs=1
redirect_stderr=true
stdout_logfile=/home/castilo-admin/htdocs/admin.castilo.co.uk/storage/logs/reverb.log

[program:laravel-scheduler]
process_name=%(program_name)s
command=php /home/castilo-admin/htdocs/admin.castilo.co.uk/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=castilo-admin
numprocs=1
redirect_stderr=true
stdout_logfile=/home/castilo-admin/htdocs/admin.castilo.co.uk/storage/logs/scheduler.log
stopwaitsecs=60

[group:laravel-services]
programs=laravel-worker,laravel-reverb,laravel-scheduler
